<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Clock | Time Master</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-glow"></div>
    <main class="app-shell">
      <nav class="top-nav"><a href="index.html">← Home</a><a href="stopwatch.html">Stopwatch</a><a href="world-time.html">World Time</a><a href="ip-checker.html">IP Checker</a><a href="dns-checker.html">DNS Checker</a></nav>
      <section class="card" aria-labelledby="chess-title">
        <div class="card-heading">
          <h1 id="chess-title">Chess Player Clock</h1>
          <p>Professional style dual timer for turn-based play.</p>
        </div>
        <div class="chess-controls">
          <label for="minutes-per-player">Minutes per player:</label>
          <input type="number" id="minutes-per-player" min="1" max="180" value="10" />
          <button id="set-chess" class="btn">Set</button>
          <button id="start-chess" class="btn primary">Start / Resume</button>
          <button id="pause-chess" class="btn">Pause</button>
          <button id="reset-chess" class="btn accent">Reset</button>
        </div>
        <div class="chess-board-clock">
          <button class="chess-player" id="player-one" data-player="1">
            <span class="player-name">Player 1</span>
            <span class="player-time" id="player-one-time">10:00</span>
          </button>
          <button class="chess-player" id="player-two" data-player="2">
            <span class="player-name">Player 2</span>
            <span class="player-time" id="player-two-time">10:00</span>
          </button>
        </div>
        <p id="chess-status" class="status">Press Start to begin.</p>
      </section>
      <footer class="footer">© 2026 dipnarayan.n. All rights reserved.</footer>
    </main>
    <script src="chess-clock.js"></script>
  </body>
</html>
